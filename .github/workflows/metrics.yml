name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: nampoinafandresena
          
          # 🎨 OPTIONS DE STYLE
          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          
          # 🖌️ PERSONNALISATION VISUELLE
          config_display: compact              # ou "large" pour plus d'espace
          config_timezone: Europe/Paris
          config_twemoji: yes                  # Émojis plus jolis
          config_octicon: yes                  # Icônes GitHub
          
          # 📊 PLUGINS POPULAIRES
          plugin_languages: yes
          plugin_languages_details: percentage # Affiche les pourcentages
          plugin_languages_skipped: node_modules, vendor
          
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          plugin_achievements: yes
          plugin_achievements_threshold: B     # Affiche les succès
          
          plugin_stars: yes
          plugin_stars_count: 4
          
          plugin_followup: yes
          plugin_followup_sections: repositories
